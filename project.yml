name: byMakerCleaner
options:
  bundleIdPrefix: com.bymaker
  minimumXcodeGenVersion: 2.38.0

targets:
  byMakerCleaner:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [byMakerCleaner]
    info:
      path: byMakerCleaner/Info.plist
      properties:
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: 13.0.0
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bymaker.byMakerCleaner
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set this in Xcode if needed
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        # Swift 6 mode is NOT forced here to avoid warnings for now.

  # ── Menu Bar Helper (Tray Widget) ────────────────────────────────────────────
  byMakerCleanerHelper:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [byMakerCleanerHelper]
    info:
      path: byMakerCleanerHelper/Info.plist
      properties:
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: 13.0.0
        # LSUIElement: true hides the app from the Dock — it lives only in the menu bar
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bymaker.byMakerCleaner.helper
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set this in Xcode if needed
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0

