name: byMakerCleaner
options:
  bundleIdPrefix: com.bymaker
  minimumXcodeGenVersion: 2.38.0

targets:
  byMakerCleaner:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [byMakerCleaner]
    info:
      path: byMakerCleaner/Info.plist
      properties:
        CFBundleShortVersionString: 1.1.2
        CFBundleVersion: 3
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: 13.0.0
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bymaker.byMakerCleaner
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set this in Xcode if needed
        MARKETING_VERSION: 1.1.2
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
