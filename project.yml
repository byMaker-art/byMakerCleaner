name: byMakerCleaner
options:
  bundleIdPrefix: com.bymaker
  minimumXcodeGenVersion: 2.38.0

targets:
  byMakerCleaner:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [byMakerCleaner]
    info:
      path: byMakerCleaner/Info.plist
      properties:
        CFBundleShortVersionString: 1.1.0
        CFBundleVersion: 2
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: 13.0.0
        LSUIElement: false
        # URL scheme for deep-links (e.g. bymakercleaner://settings)
        CFBundleURLTypes:
          - CFBundleURLName: com.bymaker.byMakerCleaner
            CFBundleURLSchemes:
              - bymakercleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bymaker.byMakerCleaner
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set this in Xcode if needed
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        # Swift 6 mode is NOT forced here to avoid warnings for now.


